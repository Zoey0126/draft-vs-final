<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>测试报告对比 · 草稿 vs 最终版本</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">⇄</span>
    <div>
      <h1>测试报告对比</h1>
      <div class="subtitle">Draft vs. Final</div>
    </div>
  </div>
  <div class="navbar">
    <label>Sprint
      <select id="sprintSelect"><option value="">— 选择 Sprint —</option></select>
    </label>
    <label>Issue Key
      <select id="issueSelect" disabled><option value="">— 先选择 Sprint —</option></select>
    </label>
    <button id="confirmBtn">确认</button>
    <span id="modeTag" class="mode-tag"></span>
  </div>
</header>

<section class="regions">
  <div class="region region-draft">
    <div class="region-head">
      <h2>区域 1 · 初稿内容</h2>
      <span class="region-sub">Draft (.docx)</span>
    </div>
    <div class="region-body" id="regionDraft"></div>
  </div>

  <div class="region region-final">
    <div class="region-head">
      <h2>区域 2 · 最终版本内容</h2>
      <span class="region-sub">Final (.pdf)</span>
    </div>
    <div class="region-body" id="regionFinal"></div>
  </div>

  <div class="region region-compare">
    <div class="region-head">
      <h2>区域 3 · 对比结果</h2>
      <span class="region-sub">Match / Diff / Ratio</span>
    </div>
    <div class="region-body" id="regionCompare"></div>
  </div>
</section>

<footer class="footer">
  <span id="genTime"></span>
</footer>

<script src="app.js?v=2"></script>
</body>
</html>
