<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>审核结果对比 · COZE vs TRAE</title>
<link rel="stylesheet" href="style.css?v=3">
<style>
/* -------- 流程二专用（不改动 style.css） -------- */
.regions-3 { grid-template-columns: 1fr 1fr 1.2fr; }
.regions-3 .region-head { border-bottom-color: var(--orange); }
.regions-3 .region-head h2 { font-size: 13px; }

/* Diff pill 徽标 */
.diff-pill {
  display: inline-block; font-size: 11px; padding: 2px 8px;
  border-radius: 10px; font-weight: 700; margin-left: 6px;
}
.diff-pill.good   { background: var(--green);  color: #fff; }    /* trae 更好（gap 负） */
.diff-pill.bad    { background: var(--red);    color: #fff; }    /* coze 更好（gap 正） */
.diff-pill.neutral{ background: var(--gray);   color: #fff; }
.diff-pill.na     { background: #e1e4e8; color: #666; }

/* 覆盖度双柱 */
.coverage-bar {
  display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
}
.coverage-bar .label { width: 60px; font-size: 12px; color: #555; }
.coverage-bar .bar {
  flex: 1; height: 18px; background: #eef2f6; border-radius: 9px; overflow: hidden;
  position: relative;
}
.coverage-bar .bar > div {
  height: 100%; border-radius: 9px; display: flex; align-items: center;
  justify-content: flex-end; padding-right: 8px; color: #fff; font-size: 11px;
  font-weight: 700; min-width: 32px;
}
.coverage-bar.coze .bar > div { background: #2980b9; }
.coverage-bar.trae .bar > div { background: #8e44ad; }

/* 缺失用例三分栏 */
.missing-3col {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 6px;
}
.missing-3col h5 {
  font-size: 11px; margin-bottom: 4px; padding: 3px 6px; border-radius: 4px;
  color: #fff; font-weight: 600;
}
.missing-3col h5.c { background: var(--green); }
.missing-3col h5.a { background: #2980b9; }
.missing-3col h5.b { background: #8e44ad; }
.missing-3col ul { list-style: none; }
.missing-3col li { font-size: 11px; padding: 3px 5px; border-bottom: 1px solid #f0f0f0; }

/* 建议交集 */
.sug-3col {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 6px;
}
.sug-3col h5 {
  font-size: 11px; margin-bottom: 4px; padding: 3px 6px; border-radius: 4px;
  color: #fff; font-weight: 600;
}
.sug-3col h5.c { background: var(--green); }
.sug-3col h5.a { background: #2980b9; }
.sug-3col h5.b { background: #8e44ad; }
.sug-3col ul { list-style: none; }
.sug-3col li { font-size: 11px; padding: 3px 5px; border-bottom: 1px solid #f0f0f0; }

/* 结论卡片 */
.conclusion-card {
  background: #fdf6e3; border: 1px solid #f5d76e; border-radius: 6px;
  padding: 10px 12px; font-size: 12px; line-height: 1.6; margin-top: 6px;
}
.conclusion-card h4 { font-size: 13px; color: #8e6f1a; margin-bottom: 4px; }
.conclusion-card .act {
  margin-top: 6px; padding-top: 6px; border-top: 1px dashed #f5d76e; color: #5a4b1a;
}

/* 单侧缺失占位 */
.side-empty {
  background: #fafbfc; border: 2px dashed #dce3ea; border-radius: 6px;
  padding: 40px 20px; text-align: center; color: var(--gray); font-size: 12px;
}

/* Issue 搜索结果 */
.issue-list { max-height: calc(100vh - 180px); overflow-y: auto; }
.issue-list .file-item { padding: 8px 12px; }
.issue-list .has-both .key { color: var(--green); }
.issue-list .has-coze .key { color: #2980b9; }
.issue-list .has-trae .key { color: #8e44ad; }
.issue-list .badge {
  font-size: 10px; padding: 1px 6px; border-radius: 8px; color: #fff;
  margin-left: 5px;
}
.badge.both { background: var(--green); }
.badge.coze { background: #2980b9; }
.badge.trae { background: #8e44ad; }

@media (max-width: 1200px) {
  .regions-3 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">⇄</span>
    <div>
      <h1>审核结果对比</h1>
      <div class="subtitle">COZE vs. TRAE · Review Quality Diff</div>
    </div>
  </div>
  <div class="navbar">
    <input id="issueSearch" placeholder="输入 Issue Key 搜索（如 HERO-62878）"
           style="min-width:280px;padding:7px 10px;border:none;border-radius:5px;font-size:13px;">
    <button id="resetBtn">恢复列表</button>
    <span id="modeTag" class="mode-tag"></span>
  </div>
</header>

<section class="regions regions-3">
  <div class="region">
    <div class="region-head">
      <h2>区域 1 · COZE 审核结果</h2>
      <span class="region-sub" id="cozeFile">-</span>
    </div>
    <div class="region-body" id="regionCoze"></div>
  </div>

  <div class="region">
    <div class="region-head">
      <h2>区域 2 · TRAE 审核结果</h2>
      <span class="region-sub" id="traeFile">-</span>
    </div>
    <div class="region-body" id="regionTrae"></div>
  </div>

  <div class="region">
    <div class="region-head">
      <h2>区域 3 · 对比结论</h2>
      <span class="region-sub">Coverage / Gap / Diff</span>
    </div>
    <div class="region-body" id="regionDiff"></div>
  </div>
</section>

<footer class="footer">
  <span id="genTime"></span>
</footer>

<script src="review_app.js?v=1"></script>
</body>
</html>
